[project]
name = "snortml-inference-final"
version = "0.2.0"
description = "Network anomaly detection calibrated on your own traffic"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nfstream>=6.5.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.scripts]
snortml-inference = "snortml_inference.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["snortml_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
